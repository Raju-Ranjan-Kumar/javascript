<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>create a table by the help of object</title>
    <style>
        table,th,td{
                    border:2px solid blue;
                    text-align:center;
                    font-size:25px;
                    margin-left:25%;
                    /* background-color: wheat; */
                  }
        #stud{
            font-weight: bold;
            font-size: 50px;
            text-decoration: underline;
            color: red;
        }
        tr:hover{
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
    <table>
        <caption id="stud">Students Details</caption>
        <thead>
            <tr>
                <th>Name</th>
                <th>Roll.no</th>
                <th>Course</th>
                <th>City</th>
            </tr>
        </thead>
        <tbody id="tbody"> </tbody>
    </table>
    <script>
        let students=[
            {name:'Raju', roll:5, course:'BCA', city:'Meerut'},
            {name:'Aadarsh', roll:10, course:'MCA', city:'Delhi'},
            {name:'Nikhil', roll:15, course:'BBA', city:'Bagpat'},
            {name:'Ankit', roll:20, course:'MBA', city:'Patna'},
            {name:'Shubham', roll:25, course:'B.tech', city:'landon'},
            {name:'Ranjan', roll:30, course:'BCA', city:'Meerut'},
            {name:'Ujwal', roll:35, course:'MCA', city:'Delhi'},
            {name:'Rohit', roll:40, course:'B.sc', city:'panjab'}
        ];
        function tabledata(students){
            const tabody=document.getElementById('tbody');
            let data='';
            for(let value of students){
              data+=`<tr> <td>${value.name}</td> <td>${value.roll}</td> <td>${value.course}</td> <td>${value.city}</td> </tr>`;
            }
            console.log(data);
            tabody.innerHTML=data;
        }
        tabledata(students);
    </script>
</body>
</html>
