<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even odd in javascript</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        h1{
            text-align: center;
            text-decoration: underline;
        }
        #div{
            background-color: aqua;
            width: 40%;
            margin: auto;
            margin-top: 15px;
            padding:15px 0px 15px 0px ;
            text-align: center;
            border-radius: 10px;
        }
        input{
            border-radius: 8px;
            height: 30px;
        }
        #btn{
            width: 70px;
            background-color: green;
        }
    </style>
</head>
<body>
    <h1>Even odd in javascript</h1>
    <div id="div">
       Enter the number: <input type="number" id="fnum"><br><br>
       <input type="submit" id="btn">
    </div>
    <script>
        let num = document.getElementById("fnum");

        document.getElementById("btn").onclick = function(){
            let data = num;
            if(data%2 == 0){
                alert("Number is even ");
            }else{
                alert("Number is odd");
            }
        }
    </script>
</body>
</html>
