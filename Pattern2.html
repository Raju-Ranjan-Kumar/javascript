<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pattern</title>
</head>
<body>
    <script>
        function pattern(value){
        let res=" ";
        for(let i=1; i<=value; i++){
            for(let j=i; j!=0; j--){
                res+=j;
            }
            res+='\n';
        }
        console.log(res);
    }
    pattern(5);
    </script>
</body>
</html>
