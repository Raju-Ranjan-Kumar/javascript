<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop in javascript</title>
</head>
<body>
    <div id="tableId"></div>
    <script>
        var table=0;
        var x=" ";
        for(var i=1; i<=10; i++)
        {
            // document.write("Hello World");
            table=table+6;
            x=x + "<p>"+ table +"</p>" ;
        }
        document.getElementById("tableId").innerHTML=x;
    </script>
</body>
</html>
