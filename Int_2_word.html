<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Int to word converter</title>
    <style>
        body{ background-color:cornflowerblue; }
        #container{ height:400px; width:420px; margin:100px auto; background:#f7f7f7; border-radius: 20px; }
        h1{background:#1f030c; color:white; margin:0; padding:15px 90px; text-transform:uppercase; text-align:center; font-size:20px;
           font-weight:bold; border-top-left-radius:20px; border-top-right-radius:20px; }
        .First{ text-align:center; font-size:20px; }
        #Integer{ border-radius: 8px; height: 25px;}
        #submit{ margin-top:50px; margin-left:154px; height:40px; width:108px; border-radius:10px; background-color:green; color: white; font-size:15px; font-weight: bold;}
        button:hover{ background-color:blue;}
        button:active{transform: translateY(3px);}
        #section{text-align: center;}
    </style>
</head>
<body>
    <div id="container">
        <h1>Number to word conveter </h1>
        <div>
            <p class="First"> Enter the integer value: <input id="Integer" type="text"> </p>
            <button type="button" id="submit" >Click Here !</button>
        </div><br>
        <section id="section"> </section>
    </div>

    <script>
        var ones = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'];
        var teens = ['ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
        var tens = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];

        //code conversion start
        function convert_millions(num) {
            if (num >= 100000) {
                return convert_millions(Math.floor(num / 100000)) + " million " + convert_thousands(num % 100000);
            } else {
                return convert_thousands(num);
            }
        }
        function convert_thousands(num) {
            if (num >= 1000) {
                return convert_hundreds(Math.floor(num / 1000)) + " thousand " + convert_hundreds(num % 1000);
            } else {
                return convert_hundreds(num);
            }
        }
        function convert_hundreds(num) {
            if (num > 99) {
                return ones[Math.floor(num / 100)] + " hundred " + convert_tens(num % 100);
            } else {
                return convert_tens(num)
            }
        }
        function convert_tens(num) {
            if (num < 10) return ones[num];
            else if (num >= 10 && num < 20) return teens[num - 10];
            else {
                return tens[Math.floor(num / 10)] + " " + ones[num % 10];
            }
        }
        function convert(num) {
            if (num == 0) return "zero";
            else return convert_millions(num);
        }
        
        //code testing start here
        function main() {
            // var cases = [0, 1, 2, 7, 10, 11,19, 20, 29, 31, 39, 41, 49, 50, 55, 63, 70, 99, 100, 137, 199, 411, 500];
            // for (var i = 0; i < cases.length; i++) {
            //     console.log(cases[i] + ": " + convert(cases[i]));
            // }

            var cases =document.getElementById("Integer").value;
            // console.log(convert(cases));

            let box=document.createElement('div')
            box.innerHTML=convert(cases);
            document.getElementById('section').appendChild(box);
        }
        document.getElementById("submit").addEventListener("click",main)
    </script>
</body>
</html>
