<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="even"></p>
    <script>
       function even(num){
           let arr=[];
           for(let i=1; i<num; i++){
               if(i%2==0){
                   arr.push(i);
               }
           }
           return arr
       }
    //    console.log(even(100));
       document.getElementById("even").innerHTML=even(100);
    </script>
</body>
</html>
